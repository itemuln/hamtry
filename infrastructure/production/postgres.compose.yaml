services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - /etc/hamtry/hamtry.env
    ports:
      - "127.0.0.1:${HAMTRY_POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - hamtry-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  hamtry-postgres-data:
    name: hamtry-postgres-data
