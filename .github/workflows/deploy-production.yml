name: Deploy Hamtry production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hamtry-production
  cancel-in-progress: false

jobs:
  validate-build-deploy:
    name: Validate, build, and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://hamtry.srv1869478.hstgr.cloud' }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hamtry_test
          POSTGRES_USER: hamtry_test
          POSTGRES_PASSWORD: ci-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U hamtry_test -d hamtry_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/hamtry_test
      SPRING_DATASOURCE_USERNAME: hamtry_test
      SPRING_DATASOURCE_PASSWORD: ci-only-password
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://hamtry.srv1869478.hstgr.cloud' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${PRODUCTION_URL:?Set the production environment variable PRODUCTION_URL}"
          : "${VPS_HOST:?Set the production secret VPS_HOST}"
          : "${VPS_PORT:?Set the production secret VPS_PORT}"
          : "${VPS_SSH_PRIVATE_KEY:?Set the production secret VPS_SSH_PRIVATE_KEY}"
          : "${VPS_SSH_KNOWN_HOSTS:?Set the production secret VPS_SSH_KNOWN_HOSTS}"
          if [[ ! "$PRODUCTION_URL" =~ ^https://[^/]+/?$ ]]; then
            echo "PRODUCTION_URL must be a path-free HTTPS origin." >&2
            exit 1
          fi
          if [[ ! "$VPS_PORT" =~ ^[0-9]+$ ]] || (( VPS_PORT < 1 || VPS_PORT > 65535 )); then
            echo "VPS_PORT must be a valid TCP port." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Front-End/client/package-lock.json

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: Back-End/hamtry/pom.xml

      - name: Validate and build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix Front-End/client ci
          npm --prefix Front-End/client run lint
          npm --prefix Front-End/client run build
          npm --prefix Front-End/client test
          ./Back-End/hamtry/mvnw --batch-mode --no-transfer-progress -f Back-End/hamtry/pom.xml verify

          artifact_directory="${RUNNER_TEMP}/hamtry-${GITHUB_SHA}"
          install -d -m 0700 "$artifact_directory"
          tar -C Front-End/client -czf "$artifact_directory/frontend.tar.gz" \
            dist server package.json src/library/design-system/theme.js src/library/design-system/tokens.json
          cp Front-End/client/theme/hamtry-theme.json "$artifact_directory/theme-seed.json"

          mapfile -t backend_jars < <(
            find Back-End/hamtry/target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' -print
          )
          if (( ${#backend_jars[@]} != 1 )); then
            echo "Expected exactly one deployable backend JAR, found ${#backend_jars[@]}." >&2
            exit 1
          fi
          install -m 0600 "${backend_jars[0]}" "$artifact_directory/hamtry-backend.jar"
          (
            cd "$artifact_directory"
            sha256sum frontend.tar.gz hamtry-backend.jar theme-seed.json > SHA256SUMS
          )

      - name: Configure pinned SSH connection
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "${HOME}/.ssh/hamtry_deploy_key"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/hamtry_deploy_key" "${HOME}/.ssh/known_hosts"
          ssh-keygen -y -f "${HOME}/.ssh/hamtry_deploy_key" >/dev/null
          known_host="$VPS_HOST"
          if [[ "$VPS_PORT" != 22 ]]; then known_host="[$VPS_HOST]:$VPS_PORT"; fi
          ssh-keygen -F "$known_host" -f "${HOME}/.ssh/known_hosts" >/dev/null

      - name: Transfer and activate release
        shell: bash
        run: |
          set -euo pipefail
          artifact_directory="${RUNNER_TEMP}/hamtry-${GITHUB_SHA}"
          remote_directory="/var/lib/hamtry-deploy/incoming/${GITHUB_SHA}"
          ssh_options=(
            -i "${HOME}/.ssh/hamtry_deploy_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=10
            -p "$VPS_PORT"
          )

          # shellcheck disable=SC2029 # SHA and path deliberately expand on the runner.
          ssh "${ssh_options[@]}" "hamtry-deploy@${VPS_HOST}" \
            "install -d -m 0700 '${remote_directory}'"
          scp -i "${HOME}/.ssh/hamtry_deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -P "$VPS_PORT" \
            "$artifact_directory/frontend.tar.gz" \
            "$artifact_directory/hamtry-backend.jar" \
            "$artifact_directory/theme-seed.json" \
            "$artifact_directory/SHA256SUMS" \
            "hamtry-deploy@${VPS_HOST}:${remote_directory}/"
          # shellcheck disable=SC2029 # SHA and path deliberately expand on the runner.
          ssh "${ssh_options[@]}" "hamtry-deploy@${VPS_HOST}" \
            "sudo /usr/local/sbin/hamtry-deploy '${GITHUB_SHA}'"

      - name: Remove SSH credentials
        if: always()
        shell: bash
        run: rm -f "${HOME}/.ssh/hamtry_deploy_key"

      - name: Verify public deployment
        shell: bash
        run: |
          set -euo pipefail
          production_origin="${PRODUCTION_URL%/}"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            "${production_origin}/" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            "${production_origin}/actuator/health" >/dev/null
          # shellcheck disable=SC2016 # Markdown backticks are literal.
          printf 'Deployed `%s` to [%s](%s).\n' \
            "$GITHUB_SHA" "$production_origin" "$production_origin" >> "$GITHUB_STEP_SUMMARY"
